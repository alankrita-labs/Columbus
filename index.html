<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The 1492 Horizon: Full VR Immersion</title>
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Georgia', serif; color: #fff; touch-action: none; position: fixed; inset: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
        
        #loading { 
            position: absolute; inset: 0; width: 100%; height: 100%;
            background: #050402; color: #d4af37; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 100; transition: opacity 1s; pointer-events: none;
        }
        #loading-text { margin-top: 15px; font-size: 14px; color: #aaa; font-family: 'Verdana', sans-serif; letter-spacing: 2px; }
        
        #three-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; }
        
        /* The VR Button needs to be prominent for the exhibit */
        #VRButton { 
            background: rgba(212, 175, 55, 0.1) !important; 
            border: 1px solid #d4af37 !important; 
            color: #d4af37 !important; 
            font-family: 'Georgia', serif !important; 
            font-style: italic !important;
            bottom: 40px !important;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div style="letter-spacing: 6px; font-size: 24px;">CHARTING THE UNKNOWN</div>
        <div id="loading-text">SYNCING SENSORS: 0%</div>
    </div>

    <div id="three-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { Water } from 'three/addons/objects/Water.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // --- SENSORY CALIBRATION ---
        if (window.WebXRPolyfill) {
            new window.WebXRPolyfill({ cardboardConfig: { CARDBOARD_UI_DISABLED: true } });
        }

        let scene, camera, renderer, water, particles, cameraRig;
        let mainShip, companionShip, islandGroup, islandModel, columbusModel, lucayanModel, flagMesh, flagPole;
        let vrMapPlane;
        
        const clock = new THREE.Clock();
        let currentScene = 1; // 1: VR Map, 2: Voyage, 3: Landfall
        let shipSpeed = 1.35;

        // Positioning Vectors for the Camera Rig
        let cameraTarget = new THREE.Vector3(0, 15, 0); 

        init();

        function init() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            
            // Atmospheric Fog: Essential for the "Sea of Darkness" depth
            scene.fog = new THREE.FogExp2(0x1a2b3c, 0.00052); 

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 45000);
            
            // --- THE RIG: The secret to smooth VR motion ---
            // The Rig moves (bobs), but the Camera rotates (user's head).
            cameraRig = new THREE.Group();
            cameraRig.add(camera);
            scene.add(cameraRig);

            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                powerPreference: "high-performance",
                alpha: false 
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            renderer.xr.enabled = true;
            
            document.body.appendChild(VRButton.createButton(renderer));
            container.appendChild(renderer.domElement);

            // --- VIBRANT LIGHTING RIG ---
            const ambient = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambient);
            
            const hemi = new THREE.HemisphereLight(0x87ceeb, 0x444444, 1.4);
            scene.add(hemi);
            
            const sun = new THREE.DirectionalLight(0xffdfb3, 3.2);
            sun.position.set(500, 350, 250);
            sun.castShadow = true;
            scene.add(sun);

            // --- SEA SPRAY PARTICLES ---
            const pGeo = new THREE.BufferGeometry();
            const pCount = 5000;
            const pCoords = new Float32Array(pCount * 3);
            for(let i=0; i < pCount * 3; i++) {
                pCoords[i] = (Math.random() - 0.5) * 1200;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pCoords, 3));
            
            particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ 
                size: 1.8, 
                color: 0xd4af37, 
                transparent: true, 
                opacity: 0.45,
                blending: THREE.AdditiveBlending 
            }));
            scene.add(particles);

            // --- RESOURCE MANAGEMENT ---
            const manager = new THREE.LoadingManager();
            manager.onProgress = (url, loaded, total) => { 
                document.getElementById('loading-text').innerText = `CALIBRATING HORIZON: ${Math.round((loaded/total)*100)}%`; 
            };
            manager.onLoad = () => { 
                document.getElementById('loading').style.opacity = '0'; 
                setTimeout(() => document.getElementById('loading').remove(), 1000); 
            };

            // --- ENVIRONMENT & WATER ---
            new RGBELoader(manager).load('sunset_sky.hdr', (tex) => {
                tex.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = tex; 
                scene.environment = tex;
            });

            water = new Water(new THREE.PlaneGeometry(40000, 40000), {
                textureWidth: 512, textureHeight: 512,
                waterNormals: new THREE.TextureLoader(manager).load('waternormals.jpg', (t) => { 
                    t.wrapS = t.wrapT = THREE.RepeatWrapping; 
                }),
                sunDirection: new THREE.Vector3(1, 1, 1).normalize(),
                sunColor: 0xffdfb3,
                waterColor: 0x001e0f,
                distortionScale: 4.2,
            });
            water.rotation.x = -Math.PI / 2;
            scene.add(water);

            // --- THE VR MAP (SCENE 1 AS 3D OBJECT) ---
            // This replaces the HTML map so it's visible in VR
            const mapTex = new THREE.TextureLoader(manager).load('map.png');
            const mapGeo = new THREE.PlaneGeometry(14, 8);
            const mapMat = new THREE.MeshBasicMaterial({ 
                map: mapTex, 
                transparent: true, 
                side: THREE.DoubleSide,
                opacity: 0.9
            });
            vrMapPlane = new THREE.Mesh(mapGeo, mapMat);
            vrMapPlane.position.set(0, 15, -10); 
            scene.add(vrMapPlane);
            // --- THE FLEET: Intricate Detailing for High-Fidelity Vessels ---
            const loader = new GLTFLoader(manager);
            loader.load('ship.glb', (gltf) => {
                mainShip = gltf.scene; 
                mainShip.scale.set(5.5, 5.5, 5.5); 
                mainShip.position.set(0, -3.2, -22);
                mainShip.traverse(node => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                scene.add(mainShip);
                
                // Creating the convoy: The Pinta or Niña following behind
                companionShip = mainShip.clone(); 
                companionShip.position.set(-45, -3.2, -40); 
                companionShip.rotation.y = 0.15; 
                scene.add(companionShip);
            });

            // --- THE DESTINATION: San Salvador / Guanahani ---
            islandGroup = new THREE.Group();
            islandGroup.position.set(0, 0, -5500);
            scene.add(islandGroup);

            loader.load('island.glb', (gltf) => { 
                islandModel = gltf.scene; 
                islandModel.scale.set(75, 75, 75); 
                islandModel.position.set(0, -8.5, 0); 
                islandGroup.add(islandModel); 
            });

            // Historically Significant Figures (Fine Print Detail)
            loader.load('columbus.glb', (gltf) => { 
                columbusModel = gltf.scene; 
                columbusModel.scale.set(6.2, 6.2, 6.2); 
                columbusModel.position.set(-22, 7.5, 120); 
                columbusModel.visible = false; 
                islandGroup.add(columbusModel); 
            });

            loader.load('lucayan.glb', (gltf) => { 
                lucayanModel = gltf.scene; 
                lucayanModel.scale.set(6.2, 6.2, 6.2); 
                lucayanModel.position.set(22, 7.5, 100); 
                lucayanModel.lookAt(-22, 7.5, 120); 
                lucayanModel.visible = false; 
                islandGroup.add(lucayanModel); 
            });

            createSpanishFlag();

            // --- THE TRANSITION ENGINE: Scene Logic ---
            const triggerVoyage = () => {
                if (currentScene !== 1) return;
                currentScene = 2;
                vrMapPlane.visible = false;
                cameraTarget.set(0, 24, 60); // Reposition rig onto the Santa María deck
            };

            const triggerLandfall = () => {
                if (currentScene !== 2) return;
                currentScene = 3;
                islandGroup.position.z = -130;
                cameraTarget.set(0, 12, 45); // Reposition rig to the beach coordinates
                if(columbusModel) columbusModel.visible = true;
                if(lucayanModel) lucayanModel.visible = true;
                if(flagMesh) flagMesh.visible = true;
                if(flagPole) flagPole.visible = true;
            };

            // --- VR INTERACTION: Tap-to-Progress ---
            // "Reality Check": Native WebXR selection handles taps even inside a headset
            const controller = renderer.xr.getController(0);
            controller.addEventListener('select', () => {
                if (currentScene === 1) triggerVoyage();
                else if (currentScene === 2) triggerLandfall();
            });
            scene.add(controller);

            // --- THE HORIZON SYMMETRY FIX ---
            renderer.xr.addEventListener('sessionstart', () => {
                // SENSORY DELAY: We wait 1200ms for the phone's gyroscope to finalize
                // its landscape shift before locking the 3D horizon.
                setTimeout(() => {
                    cameraRig.rotation.set(0, 0, 0);
                    camera.rotation.set(0, 0, 0);
                    camera.position.set(0, 0, 0);
                    onWindowResize();
                }, 1200);
            });

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
        }

        function createSpanishFlag() {
            // Designing the Royal Standard with vibrant detailing
            flagPole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.28, 0.28, 24), 
                new THREE.MeshStandardMaterial({color: 0x4d3222, roughness: 0.9})
            );
            flagPole.position.set(-30, 16, 120); 
            flagPole.visible = false;
            islandGroup.add(flagPole);

            const fCanvas = document.createElement('canvas'); 
            fCanvas.width = 1024; fCanvas.height = 512;
            const fCtx = fCanvas.getContext('2d'); 
            fCtx.fillStyle = '#ffffff'; fCtx.fillRect(0, 0, 1024, 512); 
            fCtx.fillStyle = '#cc0000'; fCtx.fillRect(420, 0, 184, 512); fCtx.fillRect(0, 180, 1024, 152);
            
            // Subdivide the plane for smooth sinusoidal wave animation
            const flagGeo = new THREE.PlaneGeometry(16, 9, 40, 40);
            const flagMat = new THREE.MeshStandardMaterial({ 
                map: new THREE.CanvasTexture(fCanvas), 
                side: THREE.DoubleSide,
                roughness: 0.95
            });
            
            flagMesh = new THREE.Mesh(flagGeo, flagMat);
            flagMesh.position.set(-20, 24, 120); 
            flagMesh.visible = false;
            islandGroup.add(flagMesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Oceanic Shader Update
            if (water) water.material.uniforms['time'].value += 1.0 / 60.0;
            
            // VR Particle Drift (Simulating atmospheric sea spray)
            if (particles) {
                particles.rotation.y += 0.0015;
                particles.position.z += 0.4;
                if(particles.position.z > 300) particles.position.z = -700;
            }

            // FLAG PHYSICS: Sinusoidal Wave propagation
            // $z = \sin(x \cdot 1.3 - t \cdot 6) \cdot (\frac{x+8}{16})$
            if (flagMesh && flagMesh.visible) {
                const pos = flagMesh.geometry.attributes.position;
                for(let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const wave = Math.sin(x * 1.3 - time * 6) * 1.2;
                    // Multiply by (x+8)/16 so the flag is pinned at the pole (x=-8)
                    pos.setZ(i, wave * (x + 8) / 16); 
                }
                flagMesh.geometry.attributes.position.needsUpdate = true;
            }

            // --- THE ADMIRAL'S HEAD RULE: Motion Logic ---
            if (currentScene === 1) {
                // Subtle breathing motion for the map view
                cameraTarget.y = 15 + Math.sin(time * 0.7) * 0.75;
            } 
            else if (currentScene === 2) {
                const pitch = Math.sin(time * 1.5) * 4.0;
                cameraTarget.set(0, 24 + pitch, 60);
                
                // Relative motion: The island approaches as the fleet "sails"
                if (islandGroup.position.z < -130) islandGroup.position.z += shipSpeed;

                // Sync fleet bobbing to the water's frequency
                if (mainShip) {
                    mainShip.position.y = pitch - 3.5;
                    mainShip.rotation.x = Math.sin(time * 1.3) * 0.2;
                    mainShip.rotation.z = Math.sin(time * 1.0) * 0.16;
                }
                if (companionShip) {
                    const cPitch = Math.sin(time * 1.5 + 1.4) * 4.0;
                    companionShip.position.y = cPitch - 3.5;
                    companionShip.rotation.x = Math.sin(time * 1.3 + 1.4) * 0.2;
                }
            } 
            else if (currentScene === 3) {
                // Gentle beach-side sway
                cameraTarget.y = 10 + Math.sin(time * 1.0) * 0.6; 
            }

            // --- IMMERSIVE LERP ---
            // We interpolate the rig's position to smooth out the ocean's bobbing
            cameraRig.position.lerp(cameraTarget, 0.05);

            // "Symmetry Check": If NOT in VR, use a standard lookAt. 
            // If IN VR, we touch NOTHING so the user's head has 1:1 rotation control.
            if (!renderer.xr.isPresenting) {
                camera.lookAt(0, 10, -120);
            } else {
                // Prevent 'phantom rotations' from conflicting with the headset sensors
                camera.rotation.order = 'YXZ';
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
