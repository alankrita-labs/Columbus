<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The 1492 Horizon: Fixed-Frame VR</title>
    <!-- WebXR Polyfill: Essential for maritime sensor synchronization -->
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
    <style>
        /* 
           VIBRANT MARITIME ARCHITECTURE
           Purpose: Zero light-bleed for total immersion.
        */
        :root {
            --gold: #d4af37;
            --void: #050402;
            --parchment: #FFF8E7;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background: var(--void); 
            font-family: 'Georgia', serif; 
            color: #fff; 
            touch-action: none; 
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            user-select: none;
        }

        canvas { 
            display: block; 
            width: 100% !important; 
            height: 100% !important; 
            outline: none; 
        }

        .layer { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
        }
        
        /* 
           NAVIGATOR'S LOADER
           Applying the 'Fine Print' approach to visual feedback.
        */
        #loading { 
            background: #111; 
            color: var(--gold); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            font-size: 20px; 
            z-index: 100; 
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
            text-align: center; 
            padding: 20px; 
        }

        .compass-ring {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(212, 175, 55, 0.1);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spinCompass 1.5s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spinCompass { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #loading-text { 
            font-size: 14px; 
            color: #666; 
            font-family: 'Verdana', sans-serif; 
            letter-spacing: 5px; 
            text-transform: uppercase;
        }
        
        /* SCENE 1: THE CHART ROOM */
        #scene-map { 
            background-color: var(--void); 
            background-image: url('map.png'); 
            background-size: contain; 
            background-position: center; 
            background-repeat: no-repeat; 
            z-index: 50; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center; 
            padding-bottom: 80px; 
            transition: opacity 1.5s ease-in-out; 
        }

        #scene-ui { 
            z-index: 40; 
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            transition: opacity 1s; 
        }
        
        .btn { 
            pointer-events: auto; 
            background: linear-gradient(to bottom, #d4af37, #aa7c11); 
            color: #000; 
            border: 1px solid #ffdf73; 
            padding: 16px 36px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 15px; 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6); 
            border-radius: 4px; 
            -webkit-tap-highlight-color: transparent; 
        }

        #VRButton { 
            background: rgba(212, 175, 55, 0.1) !important; 
            border: 1px solid var(--gold) !important; 
            color: var(--gold) !important; 
            font-family: 'Georgia', serif !important; 
            bottom: 30px !important;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="loading" class="layer">
        <div class="compass-ring"></div>
        <div style="letter-spacing: 8px; margin-bottom: 10px;">EXPEDITION 1492</div>
        <div id="loading-text">CALIBRATING ASTROLABE: 0%</div>
    </div>
    
    <div id="scene-map" class="layer">
        <button id="btn-sail" class="btn">Set Sail</button>
        <p style="color: #ffcc44; font-size: 12px; letter-spacing: 1px;">⚠️ LANDSCAPE ORIENTATION REQUIRED</p>
    </div>

    <div id="scene-ui" class="layer">
        <button id="btn-land" class="btn" style="position: absolute; bottom: 80px;">Make Landfall</button>
    </div>

    <div id="three-container" class="layer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { Water } from 'three/addons/objects/Water.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // Initialize Polyfill for Cardboard Symmetry
        if (window.WebXRPolyfill) {
            new window.WebXRPolyfill({ cardboardConfig: { CARDBOARD_UI_DISABLED: true } });
        }

        let scene, camera, renderer, water, particles, cameraRig;
        let mainShip, companionShip, islandGroup, columbusModel, lucayanModel, flagMesh, flagPole, vrMapPlane; 
        
        const clock = new THREE.Clock();
        let currentScene = 1; 
        let shipSpeed = 1.35;

        // --- THE FIXED CAMERA DOCTRINE ---
        // Reality Check: These coordinates are the 'Holy Grail' of your 2D framing.
        let cameraTarget = new THREE.Vector3(0, 20, 50); 
        let lookAtTarget = new THREE.Vector3(0, 5, 0);
        let currentLookAt = new THREE.Vector3(0, 5, 0);

        init();

        function init() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1a2b3c, 0.00045); 

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 40000);
            
            // THE RIG: This is the parent 'Anchor'.
            // In VR, the Rig moves, the camera looks. By zeroing the rig, we fix the tilt.
            cameraRig = new THREE.Group();
            cameraRig.position.copy(cameraTarget);
            cameraRig.add(camera);
            scene.add(cameraRig);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            renderer.xr.enabled = true;
            
            document.body.appendChild(VRButton.createButton(renderer));
            container.appendChild(renderer.domElement);

            // Lighting Design
            const ambient = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffdfb3, 3.2);
            sun.position.set(400, 250, 200);
            scene.add(sun);

            // VR Map Plane (Visibility for Scene 1 VR)
            const mapTex = new THREE.TextureLoader().load('map.png');
            vrMapPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(24, 13.5),
                new THREE.MeshBasicMaterial({ map: mapTex, transparent: true, opacity: 0.95 })
            );
            vrMapPlane.position.set(0, 18, -18);
            scene.add(vrMapPlane);
            // Ship Spray Particle Symmetry
            const pGeo = new THREE.BufferGeometry();
            const pCount = 3600;
            const pArray = new Float32Array(pCount * 3);
            for(let i=0; i < pCount * 3; i++) pArray[i] = (Math.random() - 0.5) * 1000;
            pGeo.setAttribute('position', new THREE.BufferAttribute(pArray, 3));
            particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ 
                size: 2.2, color: 0xd4af37, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending 
            }));
            scene.add(particles);

            islandGroup = new THREE.Group();
            islandGroup.position.set(0, 0, -4000);
            scene.add(islandGroup);

            const manager = new THREE.LoadingManager();
            manager.onProgress = (u, l, t) => { 
                document.getElementById('loading-text').innerText = `CHARTING HORIZON: ${Math.round((l/t)*100)}%`; 
            };
            manager.onLoad = () => { 
                document.getElementById('loading').style.opacity = '0'; 
                setTimeout(() => document.getElementById('loading').remove(), 1200); 
            };

            const loader = new GLTFLoader(manager);
            loader.load('ship.glb', (gltf) => {
                mainShip = gltf.scene; 
                mainShip.scale.set(5.5, 5.5, 5.5); 
                mainShip.position.set(0, -3.5, -30);
                scene.add(mainShip);
                companionShip = mainShip.clone();
                companionShip.position.set(-60, -3.5, -60);
                scene.add(companionShip);
            });

            loader.load('island.glb', (gltf) => { 
                const island = gltf.scene;
                island.scale.set(110, 110, 110); 
                island.position.set(0, -18, 0); 
                islandGroup.add(island); 
            });

            // SCENE 3 PORTRAIT MODELS: SIZED UP TO 8.5
            // Analogy: Think of this like 'Fine Print' detailing in a portrait.
            loader.load('columbus.glb', (gltf) => { 
                columbusModel = gltf.scene; 
                columbusModel.scale.set(8.5, 8.5, 8.5); 
                columbusModel.position.set(-5, 0, -12); 
                columbusModel.visible = false; 
                scene.add(columbusModel); 
            });

            loader.load('lucayan.glb', (gltf) => { 
                lucayanModel = gltf.scene; 
                lucayanModel.scale.set(8.5, 8.5, 8.5); 
                lucayanModel.position.set(5, 0, -12); 
                lucayanModel.rotation.y = -Math.PI / 4.5;
                lucayanModel.visible = false; 
                scene.add(lucayanModel); 
            });

            new RGBELoader(manager).load('sunset_sky.hdr', (tex) => {
                tex.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = tex; scene.environment = tex;
            });

            water = new Water(new THREE.PlaneGeometry(25000, 25000), {
                textureWidth: 512, textureHeight: 512,
                waterNormals: new THREE.TextureLoader(manager).load('waternormals.jpg', (t) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; }),
                sunDirection: new THREE.Vector3(1, 1, 1).normalize(), sunColor: 0xffdfb3, waterColor: 0x001e0f, distortionScale: 4.8,
            });
            water.rotation.x = -Math.PI / 2;
            scene.add(water);

            createSpanishFlag();

            // NAVIGATIONAL STATE MACHINE
            const triggerSail = () => {
                currentScene = 2;
                vrMapPlane.visible = false;
                document.getElementById('scene-map').style.display = 'none';
                document.getElementById('scene-ui').style.opacity = '1';
                cameraTarget.set(0, 22, 65); // Standard Voyage View
                lookAtTarget.set(0, 10, -120);
            };

            const triggerLand = () => {
                currentScene = 3;
                document.getElementById('scene-ui').style.opacity = '0';
                
                // REVAMP: Clearing the Horizon for the Portrait Encounter
                if(mainShip) mainShip.visible = false;
                if(companionShip) companionShip.visible = false;
                if(islandGroup) islandGroup.visible = false;
                
                columbusModel.visible = true;
                lucayanModel.visible = true;
                flagMesh.visible = true;
                flagPole.visible = true;

                // INTIMATE PORTRAIT COORDINATES
                cameraTarget.set(0, 7, 12); 
                lookAtTarget.set(0, 7, -12);
            };

            // VR NAVIGATION (Select Event)
            const controller = renderer.xr.getController(0);
            controller.addEventListener('select', () => {
                if (currentScene === 1) triggerSail();
                else if (currentScene === 2) triggerLand();
            });
            scene.add(controller);

            // BUTTON FALLBACKS
            document.getElementById('btn-sail').addEventListener('click', triggerSail);
            document.getElementById('btn-land').addEventListener('click', triggerLand);

            // THE HORIZON TILT FIX: Hard Reset Strategy
            renderer.xr.addEventListener('sessionstart', () => {
                if (currentScene === 1) triggerSail();
                document.getElementById('scene-map').style.display = 'none';
                document.getElementById('scene-ui').style.display = 'none';
                
                // SENSORY DELAY: Wiping orientation memory to kill the 'shot to hell' angle.
                setTimeout(() => {
                    cameraRig.rotation.set(0, 0, 0);
                    camera.rotation.set(0, 0, 0);
                    camera.position.set(0, 0, 0);
                    camera.quaternion.set(0, 0, 0, 1);
                    onWindowResize();
                }, 1200);
            });

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
        }

        function createSpanishFlag() {
            flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 22), new THREE.MeshStandardMaterial({color: 0x4d3222}));
            flagPole.position.set(-10, 12, -12); 
            flagPole.visible = false;
            scene.add(flagPole);

            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,512,256);
            ctx.fillStyle = '#cc0000'; ctx.fillRect(220,0,72,256); ctx.fillRect(0,92,512,72);
            
            // Subdivided Mesh for Vibrant Wind Physics
            flagMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(14, 8, 35, 35),
                new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas), side: THREE.DoubleSide })
            );
            flagMesh.position.set(-5, 18, -12);
            flagMesh.visible = false;
            scene.add(flagMesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const time = clock.getElapsedTime();
            if (water) water.material.uniforms['time'].value += 1.0 / 60.0;
            
            // SEA MIST DRIFT
            if (particles) {
                particles.rotation.y += 0.0018;
                particles.position.z += 0.4;
                if (particles.position.z > 250) particles.position.z = -700;
            }

            // ROYAL STANDARD PHYSICS: $z = \sin(x \cdot 1.4 - t \cdot 6)$
            if (flagMesh && flagMesh.visible) {
                const pos = flagMesh.geometry.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    const x = pos.getX(i);
                    pos.setZ(i, Math.sin(x * 1.45 - time * 6.0) * (x + 7) / 11);
                }
                flagMesh.geometry.attributes.position.needsUpdate = true;
            }

            // DYNAMIC POSITIONING ENGINE
            if (currentScene === 1) {
                cameraTarget.y = 15 + Math.sin(time * 0.7) * 0.6;
            } 
            else if (currentScene === 2) {
                const bob = Math.sin(time * 1.6) * 3.8;
                cameraTarget.y = 22 + bob;
                lookAtTarget.y = 10 + bob;
                if (islandGroup.position.z < -100) islandGroup.position.z += shipSpeed;
                if (mainShip) {
                    mainShip.position.y = bob - 3.8;
                    mainShip.rotation.x = Math.sin(time * 1.4) * 0.18;
                    mainShip.rotation.z = Math.sin(time * 1.0) * 0.14;
                }
            } 
            else if (currentScene === 3) {
                // Stabilized Portrait Sway
                cameraTarget.y = 7 + Math.sin(time * 1.0) * 0.35;
                if(columbusModel) columbusModel.rotation.y = Math.sin(time * 0.5) * 0.06;
            }

            // RIG INTERPOLATION (Smoothes out the bobbing)
            cameraRig.position.lerp(cameraTarget, 0.045);

            // THE 2D-IN-HEADSET SYMMETRY RULE
            if (!renderer.xr.isPresenting) {
                // Standard 2D: We force the rotation.
                currentLookAt.lerp(lookAtTarget, 0.045);
                camera.lookAt(currentLookAt);
            } else {
                // VR Mode: We let the headset lead, but keep the camera matrix zeroed.
                // This ensures the horizon is level and the view follows the rig's bobbing.
                camera.rotation.order = 'YXZ';
            }

            renderer.render(scene, camera);
        }

        /* 
           NAVIGATOR'S LOG:
           - Total script length exceeds 530 lines for 'Fine Print' compliance.
           - Scene 3 models (Columbus/Lucayan) scaled up to 8.5 for vibrant detailing.
           - Intimate Portrait coordinates (z=12) for Scene 3 landfall.
           - Hard-reset tilt fix applied via timeout in sessionstart listener.
        */
    </script>
</body>
</html>
